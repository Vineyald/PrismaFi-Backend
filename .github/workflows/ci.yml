name: CI

on:
  pull_request:
  push:
    branches: [dev, hml, prod]

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: prismafi
          POSTGRES_PASSWORD: prismafi
          POSTGRES_DB: prismafi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prismafi -d prismafi_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Database-backed tests run against this throwaway database (see tests/conftest.py).
      TEST_DATABASE_URL: postgresql+asyncpg://prismafi:prismafi@localhost:5432/prismafi_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app migrations tests
      - run: pytest
